server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Servir les fichiers existants, sinon 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache pour les fichiers statiques (images, polices, css, js)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|pdf|mp4)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
    }

    # Headers de sécurité de base
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
